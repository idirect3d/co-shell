<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>co-shell</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="brand-mark">▸</span>
    <span class="brand-name">co-shell</span>
    <span class="brand-ver" id="ver"></span>
  </div>
  <div class="top-right">
    <span class="conn" id="conn" title="WebSocket">
      <span class="conn-dot" id="connDot"></span><span id="connText"></span>
    </span>
    <button class="icon-btn" id="themeToggle" title="theme">☾</button>
    <div class="menu-wrap" id="menuWrap">
      <button class="icon-btn" id="menuBtn" title="menu">☰</button>
      <div class="menu" id="menu">
        <button class="menu-item" id="miWs">
          <span class="mi-ico"></span><span class="mi-label" data-i18n="workspace">工作区</span><span class="mi-check" id="miWsCheck">✓</span>
        </button>
        <button class="menu-item" id="miPlan">
          <span class="mi-ico"></span><span class="mi-label" data-i18n="taskPlan">任务进展</span><span class="mi-check" id="miPlanCheck">✓</span>
        </button>
        <button class="menu-item" id="miStatus">
          <span class="mi-ico"></span><span class="mi-label" data-i18n="statusBar">状态条</span><span class="mi-check" id="miStatusCheck">✓</span>
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="miModels">
          <span class="mi-ico">🧠</span><span class="mi-label" data-i18n="models">模型管理</span>
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="miSettings">
          <span class="mi-ico">⚙️</span><span class="mi-label" data-i18n="settings">系统设置</span>
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="miRestart">
          <span class="mi-ico"></span><span class="mi-label" data-i18n="restart">重启后台</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main id="layout">
  <aside id="sidebar">
    <div class="panel-head">
      <span class="ws-title">
        <span data-i18n="workspace">工作区</span>
        <button class="icon-btn sm" id="treeRefresh" data-i18n-title="refresh">⟳</button>
      </span>
      <span id="wsBranch"></span>
    </div>
    <div id="tree" class="tree"></div>
  </aside>

  <section id="stream-wrap">
    <!-- FEATURE-425: main message area title bar (height matches the workspace
         / task-plan panel heads). Left: a three-segment display-mode pill
         (silent/minimal/normal); centre: the current session title (editable). -->
    <div class="stream-head">
      <span class="stream-active" id="streamActive">●</span>
      <input type="text" class="stream-title" id="streamTitle" placeholder="会话标题" title="点击修改会话标题">
      <div class="mode-seg stream-mode" id="streamMode" title="显示模式">
        <div class="mode-seg-slider" id="streamModeSlider"></div>
        <button class="mode-seg-item" data-mode="silent">静默</button>
        <button class="mode-seg-item" data-mode="minimal">极简</button>
        <button class="mode-seg-item active" data-mode="normal">正常</button>
      </div>
    </div>
    <div id="stream" class="stream">
      <div id="streamB" class="stream-b"></div>
    </div>
    <!-- FEATURE-445: floating down-arrow button to jump back to the output
         bottom (shown when scrolled >100px from the bottom). -->
    <button id="scrollDownBtn" class="scroll-down" title="回到最新输出">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M3 5.5 L8 10.5 L13 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <!-- FEATURE-419: floating block-boundary navigation icons (top/bottom) -->
    <button id="blockNavTop" class="block-nav top" title="跳到当前块标题">↑</button>
    <button id="blockNavBottom" class="block-nav bottom" title="跳到当前块底部">↓</button>
    <!-- FEATURE-425: read-only text file previewer. Absolutely positioned over
         the main message area (#stream-wrap) so it never covers the workspace
         tree, task plan or input row, and auto-scales with the window. -->
    <div id="fileViewer" class="file-viewer hidden">
      <div class="fv-body" id="fvBody"></div>
      <div class="fv-titlebar" id="fvTitlebar">
        <span class="fv-path" id="fvPath" title="点击定位到工作区文件位置"></span>
        <span class="fv-size" id="fvSize"></span>
        <span class="fv-mtime" id="fvMtime"></span>
        <button class="fv-raw" id="fvRaw" title="切换原始文本/解析渲染">Raw</button>
        <button class="fv-close" id="fvClose" title="关闭预览">✕</button>
      </div>
    </div>
  </section>

  <aside id="plan-panel" class="hidden">
    <div class="panel-head"><span data-i18n="taskPlan">任务进展</span></div>
    <div id="planBody" class="plan-body"></div>
  </aside>

  <footer id="bottom">
    <div class="bottom-left">
      <div id="logoWrap" class="logo-wrap">
        <div id="logo" class="logo" title="co-shell"></div>
        <div id="logoMenu" class="logo-menu hidden">
          <button class="logo-menu-item" id="miIdentity">
            <span class="mi-label" data-i18n="identity">身份与个性</span>
          </button>
        </div>
      </div>
    </div>
    <div class="bottom-main">
      <div id="askArea" class="ask-area hidden">
        <div class="ask-hint" id="askHint"></div>
        <div class="ask-keys" id="askKeys"></div>
        <div class="ask-line hidden" id="askLineWrap">
          <input type="text" id="askInput" autocomplete="off">
          <button class="btn" id="askSend" data-i18n="reply">回复</button>
        </div>
        <div class="ask-interaction hidden" id="askInteraction"></div>
      </div>
      <div class="input-row">
        <button class="new-session-btn" id="newSessionBtn" title="新建会话">+</button>
        <textarea id="input" rows="1" autocomplete="off" data-i18n-ph="inputHint"></textarea>
        <button class="btn primary" id="sendBtn" title="send">▶</button>
        <!-- FEATURE-439: YOLO (You Only Live Once) master switch — a classic
             up/down toggle. Default off (thumb down, OFF visible); clicking
             flips it up to reveal the orange-red ON state. -->
        <button class="yolo-switch" id="yoloSwitch" title="YOLO 模式（You Only Live Once）：开启后所有工具调用自动批准，无需逐个确认" data-i18n-title="yoloTitle" aria-pressed="false">
          <span class="yolo-track">
            <span class="yolo-label yolo-off">OFF</span>
            <span class="yolo-label yolo-on">ON</span>
            <span class="yolo-thumb">YOLO</span>
          </span>
        </button>
      </div>
    </div>
    <div id="statusbar" class="statusbar hidden">
      <div class="mode-seg" id="modeSeg" title="切换工作模式" data-i18n-title="switchMode">
        <div class="mode-seg-slider" id="modeSegSlider"></div>
      </div>
      <div class="sb-sessions" id="sbSessionsWrap">
        <span class="sb-item" id="sbSessions">💬 0</span>
        <div class="session-menu hidden" id="sessionMenu"></div>
      </div>
      <div class="sb-model-wrap" id="sbModelTextWrap">
        <span class="sb-item" id="sbModelText"></span>
        <div class="model-menu hidden" id="modelMenu"></div>
      </div>
      <div class="sb-model-wrap" id="sbModelVisionWrap">
        <span class="sb-item" id="sbModelVision"></span>
        <div class="model-menu hidden" id="modelVisionMenu"></div>
      </div>
      <span class="sb-item" id="sbSession"></span>
      <span class="sb-item" id="sbLast"></span>
    </div>
  </footer>
</main>

<div id="preview" class="preview hidden">
  <div class="preview-box">
    <div class="preview-titlebar" id="previewTitlebar">
      <span class="pv-name" id="pvName"></span>
      <span class="pv-size" id="pvSize"></span>
      <span class="pv-mtime" id="pvMtime"></span>
      <span class="pv-res" id="pvRes"></span>
      <button class="icon-btn preview-close" id="previewClose" title="关闭">✕</button>
    </div>
    <img id="previewImg" alt="">
  </div>
</div>

<div id="identity" class="modal hidden">
  <div class="modal-box identity-box">
    <div class="modal-head">
      <span data-i18n="identity">身份与个性</span>
      <button class="icon-btn sm" id="identityClose">✕</button>
    </div>
    <div class="modal-body">
      <div id="identityBody" class="identity-body"></div>
    </div>
  </div>
</div>

<div id="settings" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span data-i18n="settings">系统设置</span>
      <button class="icon-btn sm" id="settingsClose">✕</button>
    </div>
    <div class="modal-body">
      <div id="settingsBody" class="settings-body">
        <input id="settingsSearch" class="set-search" type="text" placeholder="🔍 搜索设置..." />
        <div class="set-group-title" data-i18n="appearance">[ 外观 ]</div>
        <label class="set-row">
          <span class="set-label" data-i18n="themeMode">主题</span>
          <select id="setThemeMode">
            <option value="auto" data-i18n="themeAuto">跟随系统</option>
            <option value="dark" data-i18n="themeDark">深色</option>
            <option value="light" data-i18n="themeLight">浅色</option>
          </select>
        </label>
        <div class="set-sep"></div>
        <div id="settingsDynamic"></div>
      </div>
    </div>
  </div>
</div>

<div id="delSession" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span data-i18n="sessionDelete">删除会话</span>
      <button class="icon-btn sm" id="delSessionClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="del-session-msg" id="delSessionMsg"></div>
      <div class="del-session-actions">
        <button class="btn" id="delSessionCancel" data-i18n="cancel">取消</button>
        <button class="btn danger" id="delSessionConfirm" data-i18n="confirm">确认</button>
      </div>
    </div>
  </div>
</div>

<!-- FEATURE-429: model delete confirmation modal (mirrors the session delete modal) -->
<div id="delModel" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span data-i18n="modelDelete">删除模型</span>
      <button class="icon-btn sm" id="delModelClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="del-session-msg" id="delModelMsg"></div>
      <div class="del-session-actions">
        <button class="btn" id="delModelCancel" data-i18n="cancel">取消</button>
        <button class="btn danger" id="delModelConfirm" data-i18n="confirm">确认</button>
      </div>
    </div>
  </div>
</div>

<!-- FEATURE-422: model manager modal -->
<div id="models" class="modal hidden">
  <div class="modal-box models-box">
    <div class="modal-head">
      <span data-i18n="models">模型管理</span>
      <button class="icon-btn sm" id="modelsClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="models-toolbar">
        <button class="btn" id="modelPinBtn" title="置顶选中的模型">▲ 置顶</button>
        <button class="btn" id="modelAddBtn" data-i18n="modelAdd">＋ 新增模型</button>
        <button class="btn danger" id="modelDelBtn" title="删除选中的模型">🗑 删除</button>
      </div>
      <div id="modelsBody" class="models-body"></div>
    </div>
  </div>
</div>

<!-- FEATURE-429: model wizard modal (structured step-by-step form) -->
<div id="modelWizard" class="modal hidden">
  <div class="modal-box wizard-box">
    <div class="modal-head">
      <span data-i18n="modelWizard">模型配置向导</span>
      <button class="icon-btn sm" id="modelWizardCancel" title="取消">✕</button>
    </div>
    <div class="modal-body wizard-layout">
      <div id="modelWizardNav" class="wizard-nav"></div>
      <div class="wizard-main">
        <div id="modelWizardBody" class="wizard-body"></div>
        <div class="wizard-actions">
          <button class="btn" id="modelWizardPrev">上一步</button>
          <button class="btn primary" id="modelWizardNext">下一步</button>
          <button class="btn primary" id="modelWizardSubmit" style="display:none">完成</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
